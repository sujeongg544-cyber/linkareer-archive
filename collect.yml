name: 링커리어 게시판 수집

on:
  schedule:
    # 매일 07:00 KST = 22:00 UTC (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 수집 결과 커밋용
  pages: write              # Pages 배포용
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게시판 수집 실행
        run: python scripts/collect.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 게시판 수집 업데이트 ($(date -u +%Y-%m-%d) 07:00 KST)"
            git push
          fi

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pages 배포
        uses: actions/deploy-pages@v4
